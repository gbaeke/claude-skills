# Weekly update PRs, grouped so they arrive as a few PRs instead of dozens; CI (scripts/check.sh) checks each.
# Majors come one by one: read the changelog before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
{{#frontend}}
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
    ignore:
      # the TypeScript 6 hold (SKILL.md, Freshness): @hey-api/openapi-ts crashes on TS 7; drop this with the hold
      - dependency-name: typescript
        update-types: [version-update:semver-major]
{{/frontend}}
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
