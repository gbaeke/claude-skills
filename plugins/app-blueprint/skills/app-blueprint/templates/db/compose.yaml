# Local services. The database:  scripts/db.sh up   (or: docker compose up -d db)
# The app as its image, like on Azure:  docker compose --profile app up --build
name: {{app}}

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: {{pkg}}
      POSTGRES_PASSWORD: {{pkg}}  # local only
      POSTGRES_DB: {{pkg}}
    ports: ["127.0.0.1:{{pg_port}}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql  # PostgreSQL 18+ images keep their data in a versioned folder below this
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "{{pkg}}"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    profiles: [app]
    build: .
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql://{{pkg}}:{{pkg}}@db:5432/{{pkg}}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
