<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- Markdown rendering: marked turns the agent's Markdown into HTML, DOMPurify strips anything unsafe. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<style>
  /* A calm work tool: neutral greys with a slight blue bias, one blue accent for actions,
     amber for anything that waits on the user (approval). */
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --sunk: #eef1f5; --line: #dfe4eb; --ink: #18202b; --quiet: #677385;
    --accent: #2457d6; --accent-ink: #ffffff; --accent-soft: #e8efff; --wait: #a86200; --wait-soft: #fff4e0;
    --code-bg: #f1f3f7; --danger: #c0352b;
    --sans: "Inter", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  :root { color-scheme: light; }  /* light only, whatever the OS setting */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.55 var(--sans); color: var(--ink); background: var(--bg); display: flex; -webkit-font-smoothing: antialiased; }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Sidebar */
  aside { width: 272px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .brand b { display: block; font-size: 14px; }
  .brand small { color: var(--quiet); font-size: 12px; }
  .new { margin: 4px 12px 12px; padding: 9px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .new:hover { border-color: var(--accent); color: var(--accent); }
  .list-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--quiet); padding: 4px 16px 6px; }
  #chats { flex: 1; overflow: auto; padding: 0 8px 12px; }
  .chat { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--ink); }
  .chat span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .chat:hover { background: var(--sunk); }
  .chat.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .chat .del { opacity: 0; border: 0; background: none; color: var(--quiet); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; border-radius: 4px; }
  .chat:hover .del, .chat .del:focus-visible { opacity: 1; }
  .chat .del:hover { color: var(--danger); }
  .no-chats { color: var(--quiet); font-size: 13px; padding: 6px 10px; }

  /* Conversation */
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header.top { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header.top h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header.top .meta { font: 500 12px var(--mono); color: var(--quiet); }
  #menu { display: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 4px 9px; cursor: pointer; }
  #messages { flex: 1; overflow: auto; padding: 28px 20px 12px; scroll-behavior: smooth; }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  .row { display: flex; gap: 12px; align-items: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--sunk); color: var(--quiet); }
  .row.agent .avatar { background: var(--accent); color: var(--accent-ink); }
  .bubble { min-width: 0; max-width: 100%; }
  .row.user .bubble { background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 16px 16px 4px 16px; max-width: 78%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .row.agent .bubble { flex: 1; padding-top: 3px; }

  /* Markdown inside agent answers */
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 3px 0; }
  .md code { font: 500 .86em var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
  .md pre { background: var(--code-bg); padding: 12px 14px; border-radius: 10px; overflow: auto; }
  .md pre code { background: none; padding: 0; font-size: 13px; }
  .md table { border-collapse: collapse; margin: 0 0 10px; font-size: 14px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md th { background: var(--sunk); font-weight: 600; }
  .md a { color: var(--accent); }
  .md h1, .md h2, .md h3 { font-size: 15px; margin: 14px 0 6px; }
  .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--line); color: var(--quiet); }

  /* Progress line while the agent works */
  .progress { display: inline-flex; align-items: center; gap: 10px; color: var(--quiet); font-size: 14px; padding: 4px 0; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } #messages { scroll-behavior: auto; } }
  .error { color: var(--danger); font-size: 14px; }

  /* Approval card */
  .approval { border: 1px solid var(--wait); background: var(--wait-soft); border-radius: 12px; padding: 14px 16px; }
  .approval .head { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--wait); font-size: 14px; margin-bottom: 4px; }
  .approval .tool { font: 500 12px var(--mono); background: var(--panel); border: 1px solid var(--line); color: var(--ink); padding: 1px 7px; border-radius: 6px; }
  .approval p { margin: 0 0 10px; font-size: 14px; }
  .approval dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0 0 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .approval dt { color: var(--quiet); font: 500 12px var(--mono); padding-top: 2px; }
  .approval dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:hover { filter: brightness(1.05); }
  .decided { font-size: 13px; font-weight: 600; }
  .decided.approved { color: #1d7a43; } .decided.rejected { color: var(--danger); }
  .approval.done { background: var(--panel); border-color: var(--line); }
  .approval.done .head { color: var(--quiet); }

  /* Empty state with samples */
  .empty { max-width: 760px; margin: 6vh auto 0; text-align: center; }
  .empty .logo { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 18px; }
  .empty h2 { margin: 0 0 4px; font-size: 20px; }
  .empty p { margin: 0 0 22px; color: var(--quiet); }
  .samples { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; }
  .samples button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .samples button:hover { border-color: var(--accent); }
  .samples small { color: var(--quiet); font-size: 12px; }
  .samples .tag { align-self: flex-start; font: 500 11px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 999px; }

  /* Composer */
  form.composer { padding: 10px 20px 18px; background: linear-gradient(to bottom, transparent, var(--bg) 30%); }
  .box { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 14px; box-shadow: 0 2px 10px rgb(0 0 0 / .04); }
  .box:focus-within { border-color: var(--accent); }
  textarea:focus-visible { outline: none; }  /* the surrounding .box shows focus */
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: inherit; max-height: 160px; padding: 6px 0; }
  .send { flex: none; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; cursor: pointer; font-weight: 500; }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--quiet); text-align: center; }

  /* Phone: sidebar becomes a drawer */
  @media (max-width: 760px) {
    aside { position: fixed; inset: 0 auto 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgb(0 0 0 / .2); }
    body.drawer aside { transform: none; }
    #menu { display: block; }
    .row.user .bubble { max-width: 88%; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand"><div class="logo" id="logo">A</div><div><b id="agent-name">{{agent_title}}</b><small>Deep Agents · A2A</small></div></div>
  <button class="new" id="new" type="button"><span aria-hidden="true">＋</span> New chat</button>
  <div class="list-label">Chats</div>
  <div id="chats"></div>
</aside>
<main>
  <header class="top">
    <button id="menu" type="button" aria-label="Show chats">☰</button>
    <h1 id="title">New chat</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div id="messages"><div class="thread" id="thread"></div></div>
  <form class="composer" id="composer">
    <div class="box">
      <label for="text" class="sr" hidden>Message</label>
      <textarea id="text" rows="1" placeholder="Message the agent" autocomplete="off"></textarea>
      <button class="send" id="sendbtn" type="submit">Send</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </form>
</main>
<script>
// The UI only talks to the BFF (/api/...). It never calls the agent directly.
let current = null;
let busy = false;

// Name, description and sample questions come from the agent's Agent Card (GET /api/agent).
let AGENT = { name: "{{agent_title}}", description: "", examples: [], service: "{{agent}}-agent" };

const $ = id => document.getElementById(id);
const thread = $("thread");
const escape = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Markdown → safe HTML. If the libraries didn't load (offline), fall back to plain text.
function md(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }));
  return escape(text).replace(/\n/g, "<br>");
}

function scrollDown() { const m = $("messages"); m.scrollTop = m.scrollHeight; }

function setHeader(title, id) { $("title").textContent = title || "New chat"; $("meta").textContent = id ? id.slice(0, 8) : ""; }

function showSamples() {
  const initial = escape(AGENT.name.charAt(0) || "A");
  thread.innerHTML = `<div class="empty"><div class="logo">${initial}</div><h2>${escape(AGENT.name)}</h2>
    <p>${escape(AGENT.description || "Ask a question to start.")}</p><div class="samples">` +
    AGENT.examples.map((q, i) => `<button type="button" data-sample="${i}">${escape(q)}</button>`).join("") +
    `</div></div>`;
  thread.querySelectorAll("[data-sample]").forEach(b => b.addEventListener("click", () => send(AGENT.examples[+b.dataset.sample])));
}

async function loadAgent() {
  try { AGENT = await (await fetch("/api/agent")).json(); } catch { /* keep the defaults */ }
  $("agent-name").textContent = AGENT.name;
  $("logo").textContent = AGENT.name.charAt(0) || "A";
  $("text").placeholder = "Message " + AGENT.name;
  document.title = AGENT.name;
}

function addRow(role, html) {
  const row = document.createElement("div");
  row.className = "row " + role;
  row.innerHTML = role === "agent"
    ? `<div class="avatar" aria-hidden="true">${escape(AGENT.name.charAt(0) || "A")}</div><div class="bubble md"></div>`
    : `<div class="bubble"></div><div class="avatar" aria-hidden="true">You</div>`;
  const bubble = row.querySelector(".bubble");
  if (html !== undefined) bubble.innerHTML = html;
  thread.appendChild(row); scrollDown();
  return bubble;
}
const userRow = text => { const b = addRow("user"); b.textContent = text; };
const agentRow = text => addRow("agent", md(text));

async function loadChats() {
  const chats = await (await fetch("/api/chats")).json();
  const list = $("chats");
  list.innerHTML = chats.length ? "" : `<div class="no-chats">No chats yet.</div>`;
  for (const c of chats) {
    const div = document.createElement("div");
    div.className = "chat" + (c.id === current ? " active" : "");
    div.title = c.id;
    div.innerHTML = `<span>${escape(c.title)}</span><button class="del" type="button" aria-label="Delete chat">×</button>`;
    div.addEventListener("click", () => openChat(c.id));
    div.querySelector(".del").addEventListener("click", e => { e.stopPropagation(); deleteChat(c.id); });
    list.appendChild(div);
    if (c.id === current) setHeader(c.title, c.id);
  }
}

// Deletes the chat in the BFF and, through the BFF, the agent's checkpoints and A2A tasks.
async function deleteChat(id) {
  const res = await fetch(`/api/chats/${id}`, { method: "DELETE" });
  if (!res.ok) { agentRow("Could not delete the chat."); return; }
  if (id === current) { current = null; setHeader(); showSamples(); }
  await loadChats();
}

async function newChat() {
  const chat = await (await fetch("/api/chats", { method: "POST" })).json();
  current = chat.id; setHeader(chat.title, chat.id); showSamples();
  document.body.classList.remove("drawer");
  await loadChats(); $("text").focus();
}

async function openChat(id) {
  current = id;
  const chat = await (await fetch(`/api/chats/${id}`)).json();
  setHeader(chat.title, id);
  thread.innerHTML = "";
  if (!chat.messages.length) showSamples();
  for (const m of chat.messages) {
    if (m.role === "user") userRow(m.text);
    else if (m.role === "approval") approvalCard(m.text, m.data?.action || {}, m.data?.decision);  // decided, or still open
    else agentRow(m.text);
  }
  document.body.classList.remove("drawer");
  await loadChats();
}

// `decision` is set when the text answers an approval card: the card shows the choice,
// so no separate user bubble is added.
async function send(text, decision = false) {
  text = (text ?? $("text").value).trim();
  if (!text || busy) return;
  if (!current) await newChat();
  if (thread.querySelector(".empty")) thread.innerHTML = "";  // first message: hide the samples
  if (!decision) { $("text").value = ""; grow(); }
  setBusy(true);
  if (!decision) userRow(text);
  const answer = addRow("agent", `<span class="progress"><span class="spinner"></span><span>Sending…</span></span>`);
  let started = false, errored = false, full = "";

  try {
    // POST and read the Server-Sent Events stream from the BFF.
    const res = await fetch(`/api/chats/${current}/messages`, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text }) });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop();
      for (const e of events) {
        if (!e.startsWith("data: ")) continue;
        const ev = JSON.parse(e.slice(6));
        // Progress from the agent (A2A WORKING status with a message), shown until the answer starts.
        if (ev.type === "status" && !started) answer.querySelector(".progress span:last-child").textContent = ev.text;
        if (ev.type === "token") { full += ev.text; answer.innerHTML = md(full); started = true; scrollDown(); }
        if (ev.type === "approval") { if (!started) answer.closest(".row").remove(); approvalCard(ev.text, ev.action); }
        if (ev.type === "error") { answer.innerHTML = `<span class="error">Error: ${escape(ev.text)}</span>`; errored = true; }
      }
    }
  } catch (err) {
    answer.innerHTML = `<span class="error">Error: ${escape(err.message)}</span>`; errored = true;
  }
  // The stream ended without an answer, approval or error: say so instead of leaving a spinner.
  if (!started && !errored && answer.isConnected)
    answer.innerHTML = `<span class="error">No answer from the agent. Check <code>docker compose logs ${escape(AGENT.service)}</code>.</span>`;
  setBusy(false);
  loadChats();
}

// The proposed tool call with its arguments. `decision` is "approved" / "rejected" for a card
// from history; null or undefined means it still waits, so it gets the buttons.
function approvalCard(text, action, decision) {
  const args = action.args || {};
  const rows = Object.entries(args).map(([k, v]) => `<dt>${escape(k)}</dt><dd>${escape(typeof v === "string" ? v : JSON.stringify(v))}</dd>`).join("");
  const decided = d => `<div class="decided ${d}">${d === "approved" ? "✓ Approved" : "✕ Rejected"}</div>`;
  const card = addRow("agent", `<div class="approval${decision ? " done" : ""}">
      <div class="head">${decision ? "Proposed" : "Approval needed"} ${action.tool ? `<span class="tool">${escape(action.tool)}</span>` : ""}</div>
      ${decision ? "" : `<p>${escape(text)}</p>`}${rows ? `<dl>${rows}</dl>` : ""}
      ${decision ? decided(decision) : `<div class="actions"><button class="btn primary" type="button" data-d="approve">Approve</button><button class="btn" type="button" data-d="reject">Reject</button></div>`}
    </div>`);
  card.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => {
    const approve = b.dataset.d === "approve";
    card.querySelector(".actions").outerHTML = decided(approve ? "approved" : "rejected");
    card.querySelector(".approval").classList.add("done");
    send(approve ? "approve" : "Rejected by the user.", true);
  }));
}

function setBusy(on) { busy = on; $("sendbtn").disabled = on; }
function grow() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }

$("composer").addEventListener("submit", e => { e.preventDefault(); send(); });
$("text").addEventListener("input", grow);
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("new").addEventListener("click", newChat);
$("menu").addEventListener("click", () => document.body.classList.toggle("drawer"));

loadAgent().then(() => { if (!thread.children.length || thread.querySelector(".empty")) showSamples(); });
showSamples();
loadChats();
</script>
</body>
</html>
